---
- name: Upgrade system packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - unattended-upgrades
    state: present

- name: Keep security updates automatic
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"  # NOSONAR - apt config is read by non-root apt tools; contains no secrets

- name: Read current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_tz
  changed_when: false

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone {{ sentra_timezone }}
  when: common_current_tz.stdout != sentra_timezone
  changed_when: true

# ---- Swap file -----------------------------------------------------------
- name: Check for swap file
  ansible.builtin.stat:
    path: /swapfile
  register: common_swapfile

- name: Create swap file
  ansible.builtin.command: fallocate -l {{ sentra_swap_size_mb }}M /swapfile
  when: not common_swapfile.stat.exists and sentra_swap_size_mb | int > 0
  changed_when: true

- name: Secure swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when: sentra_swap_size_mb | int > 0

- name: Format and enable swap
  ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
  when: not common_swapfile.stat.exists and sentra_swap_size_mb | int > 0
  changed_when: true

- name: Enable swap at boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0
  when: sentra_swap_size_mb | int > 0
