[defaults]
inventory = inventory/hosts.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# Long Docker builds (PyTorch) are run async; keep a generous timeout
timeout = 60

[ssh_connection]
# Trust the VM's host key on first connect, then pin it (protects later runs)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
pipelining = True
