name: Infrastructure CI

# Static checks for the GCP Terraform and the Ansible playbook.
# No cloud credentials are needed: nothing is planned or applied from CI.
# Provisioning is done from a developer machine (see README).

on:
  push:
    branches: [main]
    paths:
      - 'terraform/gcp/**'
      - 'ansible/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/gcp/**'
      - 'ansible/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  ansible:
    name: Ansible (syntax + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          pip install --only-binary :all: -r ../.github/ci-requirements.txt

      - name: Syntax check
        run: |
          printf '[sentra]\nci ansible_host=127.0.0.1 ansible_user=ci\n' > /tmp/ci-hosts.ini
          ansible-playbook -i /tmp/ci-hosts.ini site.yml --syntax-check

      - name: Lint
        run: ansible-lint site.yml
